name: checks

# Runs on the template itself, and on any copy made from it.
#
# Deliberately does NOT run the Playwright suite. Regression runs on QA team members' own machines,
# against the release under test (`npm run test:regression`, then `npm run report:cycle`), so no pipeline
# holds environment credentials and no runner has to reach the QA environment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Catches documentation that has drifted from the repository: an agent added without being
      # documented, a section or invariant total gone stale, a directory missing from the component
      # reference, a broken link, or a term from another project leaking into a neutral template.
      - name: Check docs against the repository
        run: npm run check:docs

      # Enforces I8: every story test carries a TCID, every TCID is in its plan, none duplicated or retired.
      - name: Check traceability
        run: npm run check:trace
